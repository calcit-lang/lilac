name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Yarn Berry
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - name: Install deps
        run: yarn install --immutable

      - uses: calcit-lang/setup-calcit@v1

      - name: "test"
        run: |
          caps --ci --strict
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --entry test --check-only
          calcit calcit.cirru analyze check-types --summary-only --format json
          calcit calcit.cirru analyze weak-types --only schema-dynamic,code-dynamic,code-nil --intent unresolved,declared-optional --summary-only --format json
          calcit calcit.cirru analyze deprecated --summary-only --format json
          mode=dev calcit calcit.cirru --entry test

      - name: "test js"
        run: >
          mode=dev calcit calcit.cirru --entry test js
          && mode=dev node test.mjs
